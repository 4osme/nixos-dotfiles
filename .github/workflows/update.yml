name: update

on:
  schedule:
    # Weekly (Sunday 18:00 UTC = Monday 03:00 JST).
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: nix flake update -> PR -> auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake update
        run: nix flake update

      - name: Open/refresh the PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged; nothing to do."
            exit 0
          fi

          # Follow the repository's default branch (master today, main if it
          # is ever renamed).
          base=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)

          branch=flake-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add flake.lock
          git commit -m "chore(flake): update inputs ($(date -u +%F))"
          git push --force-with-lease -u origin "$branch"

          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create \
              --base "$base" \
              --head "$branch" \
              --title "chore(flake): update inputs ($(date -u +%F))" \
              --body "Automated weekly \`nix flake update\`.

          The build workflow validates the update; auto-merge merges it as soon as
          the required checks pass (enable \`Allow auto-merge\` and the required
          status checks in the repository settings, see the README)."
          fi

          gh pr merge "$branch" --auto --squash --delete-branch
