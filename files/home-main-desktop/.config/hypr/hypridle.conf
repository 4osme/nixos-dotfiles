general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 300
    on-timeout = hyprlock
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# DPMS off / suspend are intentionally omitted: this host is used as a
# Sunshine streaming host, and turning the outputs off empties Sunshine's
# KMS monitor list (encoder init then fails with
# "Unable to find display or encoder during startup").

