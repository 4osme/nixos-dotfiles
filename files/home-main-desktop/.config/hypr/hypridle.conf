general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# main-desktop: relaxed idle timeouts compared to the shared defaults
# (AGENTS.md: スリープに移行する待機時間の緩和). The machine is also the
# suspend-then-hibernate target (boot.resumeDevice = the 112G swap).
listener {
    timeout = 600
    on-timeout = hyprlock
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600
    on-timeout = systemctl suspend-then-hibernate
}
